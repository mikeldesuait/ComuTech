<!-- templates/mi-empresa.html -->
<!-- 🏢 DATOS DE FACTURACIÓN DE MI EMPRESA -->

<div class="alert-info">
    <strong>🏢 Datos de facturación de COMUTECH</strong>
    <p>Estos datos aparecerán en las facturas que emitas.</p>
</div>

<div class="row-flex">
    <div class="grupo">
        <label>🏢 Razón Social</label>
        <input type="text" id="empresaNombre" placeholder="Razón Social">
    </div>
    <div class="grupo">
        <label>📧 Email</label>
        <input type="email" id="empresaEmail" placeholder="Email">
    </div>
</div>

<div class="row-flex">
    <div class="grupo">
        <label>📋 NIF/CIF</label>
        <input type="text" id="empresaNif" placeholder="NIF/CIF">
    </div>
    <div class="grupo">
        <label>📞 Teléfono</label>
        <input type="tel" id="empresaTelefono" placeholder="Teléfono">
    </div>
</div>

<div class="row-flex">
    <div class="grupo">
        <label>🌐 Web</label>
        <input type="text" id="empresaWeb" placeholder="www.tuempresa.com">
    </div>
</div>

<!-- DIRECCIÓN -->
<div class="card-header">📍 Dirección</div>

<div class="row-flex">
    <div class="grupo"><label>Calle</label><input type="text" id="empresaCalle" placeholder="Calle"></div>
    <div class="grupo"><label>Número</label><input type="text" id="empresaNumero" placeholder="Número"></div>
    <div class="grupo"><label>Piso</label><input type="text" id="empresaPiso" placeholder="Piso/Puerta"></div>
</div>

<div class="row-flex">
    <div class="grupo"><label>CP</label><input type="text" id="empresaCp" placeholder="Código postal"></div>
    <div class="grupo"><label>Ciudad</label><input type="text" id="empresaCiudad" placeholder="Ciudad"></div>
    <div class="grupo"><label>Provincia</label><input type="text" id="empresaProvincia" placeholder="Provincia"></div>
</div>

<!-- DATOS BANCARIOS -->
<div class="card-header">🏦 Datos bancarios</div>

<div class="row-flex">
    <div class="grupo"><label>IBAN</label><input type="text" id="empresaIban" placeholder="IBAN"></div>
    <div class="grupo"><label>Banco</label><input type="text" id="empresaBanco" placeholder="Nombre del banco"></div>
    <div class="grupo"><label>SWIFT</label><input type="text" id="empresaSwift" placeholder="Código SWIFT"></div>
</div>

<!-- BOTONES -->
<div class="btn-group">
    <button id="btnGuardarEmpresa" class="btn-success">💾 Guardar cambios</button>
    <button id="btnCancelarEmpresa" class="btn-danger">✖ Cancelar</button>
</div>
