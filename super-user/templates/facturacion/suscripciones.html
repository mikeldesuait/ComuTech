<!-- templates/facturacion/suscripciones.html -->
<div class="suscripciones-container">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 style="font-size: 20px; font-weight: 600;">📅 Suscripciones</h2>
        <button id="btnGenerarFacturasAhora" class="btn-warning" style="padding: 8px 16px; font-size: 13px;">⚡ Generar</button>
    </div>
    
    <div class="card">
        <div class="card-header">🏷️ Planes</div>
        <div class="row-flex">
            <div class="grupo">
                <label>Básico (€/mes)</label>
                <input type="number" id="precioBasico" value="49" step="1">
            </div>
            <div class="grupo">
                <label>Pro (€/mes)</label>
                <input type="number" id="precioPro" value="99" step="1">
            </div>
            <div class="grupo">
                <label>Empresa (€/mes)</label>
                <input type="number" id="precioEmpresa" value="199" step="1">
            </div>
        </div>
        <button id="btnGuardarPrecios" class="btn-success" style="width: 100%;">💾 Guardar precios</button>
    </div>
    
    <div class="card">
        <div class="card-header">➕ Extras globales</div>
        <div id="extrasGlobalesLista" style="margin-bottom: 12px;"></div>
        <div class="row-flex">
            <input type="text" id="nuevoExtraConcepto" placeholder="Concepto" style="flex: 2;">
            <input type="number" id="nuevoExtraImporte" placeholder="Importe" style="width: 100px;">
            <button id="btnAgregarExtraGlobal" class="btn-info">➕</button>
        </div>
    </div>
    
    <div class="card">
        <div class="card-header">👥 Suscripciones activas</div>
        <div id="suscripcionesLista">
            <div style="text-align:center; padding:40px;">
                <div class="spinner"></div>
                <p>Cargando...</p>
            </div>
        </div>
    </div>
    
</div>
