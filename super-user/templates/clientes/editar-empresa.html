<!-- templates/clientes/editar-empresa.html -->
<!-- 🏢 MANIQUÍ - FORMULARIO DE EDICIÓN DE EMPRESA -->

<input type="hidden" id="editClienteId">
<input type="hidden" id="editPerfilId">

<!-- ALERTA INFORMATIVA -->
<div class="alert-info">
    <strong>🏢 Editando EMPRESA</strong>
    <p>Los campos marcados con * son obligatorios. El email NO se puede cambiar desde aquí.</p>
</div>

<!-- DATOS DE LA EMPRESA -->
<div class="card-header">🏢 Datos de la empresa</div>

<div class="row-flex">
    <div class="grupo">
        <label>🏢 Razón Social *</label>
        <input type="text" id="editRazonSocial" placeholder="Razón Social" autocomplete="off">
    </div>
</div>

<div class="row-flex">
    <div class="grupo">
        <label>📧 Email actual (no editable)</label>
        <input type="email" id="editEmail" readonly style="background: #f1f5f9; cursor: not-allowed;">
    </div>
</div>

<div class="row-flex">
    <div class="grupo">
        <label>📋 NIF/CIF</label>
        <input type="text" id="editNif" placeholder="NIF/CIF" autocomplete="off">
    </div>
    <div class="grupo">
        <label>📞 Teléfono</label>
        <input type="tel" id="editTelefono" placeholder="Teléfono" autocomplete="off">
    </div>
</div>

<div class="row-flex">
    <div class="grupo">
        <label>📱 WhatsApp</label>
        <input type="tel" id="editWhatsapp" placeholder="Número de WhatsApp" autocomplete="off">
    </div>
    <div class="grupo">
        <label>👤 Nombre contacto</label>
        <input type="text" id="editNombreContacto" placeholder="Persona de contacto" autocomplete="off">
    </div>
</div>

<div class="row-flex">
    <div class="grupo">
        <label>📋 Forma Social</label>
        <select id="editFormaSocial">
            <option value="">Selecciona</option>
            <option value="A">Sociedad Anónima (S.A.)</option>
            <option value="B">Sociedad Limitada (S.L.)</option>
            <option value="C">Sociedad Colectiva</option>
            <option value="D">Sociedad Comanditaria</option>
            <option value="J">Sociedad Civil</option>
        </select>
    </div>
    <div class="grupo">
        <label>📅 Fecha constitución</label>
        <input type="date" id="editFechaConstitucion">
    </div>
</div>

<div class="row-flex">
    <div class="grupo">
        <label>📋 Registro Mercantil</label>
        <input type="text" id="editRegistroMercantil" placeholder="Registro Mercantil" autocomplete="off">
    </div>
    <div class="grupo">
        <label>👤 Representante legal</label>
        <input type="text" id="editRepresentante" placeholder="Nombre del representante" autocomplete="off">
    </div>
</div>

<!-- DOMICILIO -->
<div class="card-header">📍 Datos de domicilio</div>

<div class="row-flex">
    <div class="grupo"><label>Calle</label><input type="text" id="editCalle" placeholder="Calle" autocomplete="off"></div>
    <div class="grupo"><label>Número</label><input type="text" id="editNumero" placeholder="Número" autocomplete="off"></div>
    <div class="grupo"><label>Piso</label><input type="text" id="editPiso" placeholder="Piso/Puerta" autocomplete="off"></div>
</div>

<div class="row-flex">
    <div class="grupo"><label>CP</label><input type="text" id="editCp" placeholder="Código postal" autocomplete="off"></div>
    <div class="grupo"><label>Ciudad</label><input type="text" id="editCiudad" placeholder="Ciudad/Municipio" autocomplete="off"></div>
    <div class="grupo"><label>Provincia</label><input type="text" id="editProvincia" placeholder="Provincia" autocomplete="off"></div>
</div>

<!-- DATOS BANCARIOS -->
<div class="card-header">🏦 Datos bancarios</div>

<div class="row-flex">
    <div class="grupo"><label>IBAN</label><input type="text" id="editIban" placeholder="IBAN" autocomplete="off"></div>
    <div class="grupo"><label>Banco</label><input type="text" id="editBanco" placeholder="Nombre del banco" autocomplete="off"></div>
    <div class="grupo"><label>SWIFT</label><input type="text" id="editSwift" placeholder="Código SWIFT" autocomplete="off"></div>
</div>

<!-- DATOS DE ACTIVIDAD -->
<div class="card-header">📊 Datos de actividad</div>

<div class="row-flex">
        <div class="grupo">
        <label>📋 CNAE</label>
        <input type="text" id="editCnae" placeholder="Código CNAE" autocomplete="off">
    </div>
</div>

<div class="row-flex">
    <div class="grupo">
        <label>📅 Fecha inicio actividad</label>
        <input type="date" id="editFechaInicioActividad">
    </div>
</div>

<!-- SEGURIDAD -->
<div class="card-header">🔐 Seguridad</div>

<div class="row-flex">
    <div class="grupo">
        <button id="btnResetPassword" class="btn-warning" style="width: 100%;">🔄 Resetear contraseña del gerente</button>
    </div>
</div>

<!-- BOTONES -->
<div class="btn-group">
    <button id="btnGuardarEdicion" class="btn-success">💾 Guardar cambios</button>
    <button id="btnCancelarEdicion" class="btn-danger">✖ Cancelar</button>
</div>
