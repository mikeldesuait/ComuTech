<!-- templates/clientes/clientes.html -->
<div class="facturacion-container">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 style="font-size: 20px; font-weight: 600;">🏢 Clientes</h2>
        <button id="btnNuevoCliente" class="btn-success" style="padding: 8px 20px; border-radius: 25px; font-weight: 600;">
            + Nuevo cliente
        </button>
    </div>
    
    <!-- Buscador -->
    <div class="search-bar">
        <span>🔍</span>
        <input type="text" id="buscadorCliente" placeholder="Buscar cliente...">
    </div>
    
    <!-- Filtros horizontales -->
    <div style="display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px;">
        <select id="filtroPlan" class="badge" style="background: var(--ios-gray-light); border: none; padding: 8px 12px; border-radius: 20px;">
            <option value="">Todos</option>
            <option value="BASICO">Básico</option>
            <option value="PRO">Pro</option>
            <option value="EMPRESA">Empresa</option>
        </select>
        <select id="filtroEstado" class="badge" style="background: var(--ios-gray-light); border: none; padding: 8px 12px; border-radius: 20px;">
            <option value="">Todos</option>
            <option value="activo">Activos</option>
            <option value="inactivo">Inactivos</option>
        </select>
        <select id="filtroProvincia" class="badge" style="background: var(--ios-gray-light); border: none; padding: 8px 12px; border-radius: 20px;">
            <option value="">Todas</option>
        </select>
    </div>
    
    <!-- Lista de clientes (cards) -->
    <div id="listaClientes" class="clientes-lista">
        <div style="text-align: center; padding: 40px;">
            <div class="spinner"></div>
            <p style="margin-top: 12px; color: var(--ios-gray);">Cargando clientes...</p>
        </div>
    </div>
    
</div>
