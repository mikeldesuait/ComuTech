<!-- templates/clientes/clientes.html -->
<!-- 📱 LISTA DE CLIENTES ESTILO INSTAGRAM -->

<!-- Buscador -->
<div class="search-bar">
    <span>🔍</span>
    <input type="text" id="buscadorCliente" placeholder="Buscar cliente...">
</div>

<!-- Filtros horizontales -->
<div style="display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px;">
    <select id="filtroPlan" class="badge" style="background: var(--ios-gray-light); border: none; padding: 8px 12px;">
        <option value="">Todos</option>
        <option value="BASICO">Básico</option>
        <option value="PRO">Pro</option>
        <option value="EMPRESA">Empresa</option>
    </select>
    <select id="filtroEstado" class="badge" style="background: var(--ios-gray-light); border: none; padding: 8px 12px;">
        <option value="">Todos</option>
        <option value="activo">Activos</option>
        <option value="inactivo">Inactivos</option>
    </select>
    <select id="filtroProvincia" class="badge" style="background: var(--ios-gray-light); border: none; padding: 8px 12px;">
        <option value="">Todas</option>
    </select>
</div>

<!-- Lista de clientes (cards) -->
<div id="listaClientes" class="clientes-lista">
    <div style="text-align: center; padding: 40px;">
        <div class="spinner"></div>
        <p style="margin-top: 12px; color: var(--ios-gray);">Cargando clientes...</p>
    </div>
</div>

<!-- Botón flotante (FAB) -->
<button id="btnNuevoCliente" style="position: fixed; bottom: 80px; right: 16px; width: 56px; height: 56px; border-radius: 28px; background: var(--ios-blue); font-size: 24px; box-shadow: var(--ios-shadow-heavy); z-index: 100;">
    +
</button>
