<!-- templates/mi-perfil.html -->
<!-- 👤 PERFIL DEL USUARIO - SOLO DATOS PERSONALES -->

<div class="alert-info">
    <strong>👤 Datos personales del usuario</strong>
    <p>Estos datos son personales. Los datos fiscales de tu empresa están en "Mi Empresa".</p>
</div>

<!-- ============================================================ -->
<!-- DATOS PERSONALES                                            -->
<!-- ============================================================ -->
<div class="card-header">👤 Datos personales</div>

<div class="row-flex">
    <div class="grupo">
        <label>👤 Nombre completo</label>
        <input type="text" id="perfilNombre" placeholder="Nombre y apellidos">
    </div>
</div>

<div class="row-flex">
    <div class="grupo">
        <label>📧 Email</label>
        <input type="email" id="perfilEmail" readonly style="background: #f1f5f9; cursor: not-allowed;">
        <small>El email no se puede cambiar desde aquí</small>
    </div>
    <div class="grupo">
        <label>📞 Teléfono</label>
        <input type="tel" id="perfilTelefono" placeholder="Teléfono de contacto">
    </div>
</div>

<!-- ============================================================ -->
<!-- SEGURIDAD                                                   -->
<!-- ============================================================ -->
<div class="card-header">🔐 Seguridad</div>

<div class="row-flex">
    <div class="grupo">
        <button id="btnCambiarPassword" class="btn-warning" style="width: 100%;">🔄 Cambiar mi contraseña</button>
    </div>
</div>

<!-- ============================================================ -->
<!-- BOTONES                                                     -->
<!-- ============================================================ -->
<div class="btn-group">
    <button id="btnGuardarPerfil" class="btn-success">💾 Guardar cambios</button>
    <button id="btnCancelarPerfil" class="btn-danger">✖ Cancelar</button>
</div>
