<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Panel Técnico · COMUTECH</title>
    <link rel="stylesheet" href="css/styles.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="COMUTECH Técnico">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- LOGIN PANEL -->
<div id="loginPanel" class="login-container">
    <div class="login-card">
        <h2>🔧 Panel del Técnico</h2>
        <p>Acceso para técnicos y subcontratas</p>
        <input type="text" id="identificador" placeholder="Nick o Email" autocomplete="username">
        <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
        <button id="btnLogin">Iniciar sesión</button>
        <div id="errorMsg" class="error-msg"></div>
    </div>
</div>

<!-- DASHBOARD PANEL -->
<div id="dashboardPanel" style="display: none;">
    <div class="dashboard-header">
        <h1 id="nombreEmpresaBanner">Cargando...</h1>
        <div class="header-tecnico">
            <span>👨‍🔧 <span id="nombreTecnico">Cargando...</span></span>
            <span>📧 <span id="emailTecnico"></span></span>
            <div style="display: flex; gap: 8px;">
                <button id="btnRefrescar" class="btn-logout">🔄</button>
                <button id="btnLogout" class="btn-logout">🚪 Salir</button>
            </div>
        </div>
    </div>
    <div id="contenidoPanel"></div>
    <!-- TAB BAR -->
    <div class="bottom-nav">
        <button class="nav-item active" data-tab="tareas"><span>📋</span><span>Tareas</span></button>
        <button class="nav-item" data-tab="materiales"><span>📦</span><span>Materiales</span></button>
        <button class="nav-item" data-tab="seguimiento"><span>⏱️</span><span>Seguimiento</span></button>
        <button class="nav-item" data-tab="perfil"><span>👤</span><span>Perfil</span></button>
    </div>
</div>

<!-- PANTALLA DE TRABAJO -->
<div id="trabajoScreen" class="screen" style="display: none;">
    <div class="screen-header">
        <button class="btn-back" id="btnBackTrabajo">←</button>
        <span style="font-weight: 600; flex:1;" id="trabajoTitulo">Cargando...</span>
        <button id="btnAutoSaveIndicator" class="btn-logout" style="background:#e2e8f0; color:#475569;">💾 Guardado</button>
    </div>
    <div class="screen-content" id="trabajoContent"></div>
</div>

<!-- MODALES -->
<div id="modalAceptarTarea" class="modal-overlay">
    <div class="modal-content">
        <h3>✅ Aceptar tarea</h3>
        <div class="form-group"><label>📋 ORDEN DE TRABAJO</label><div class="detalle-info" id="modalOrdenTrabajo"></div></div>
        <div class="form-group"><label>📅 Fecha propuesta</label><input type="date" id="modalFechaPropuesta"></div>
        <div class="form-group"><label>⏰ Hora propuesta</label><input type="time" id="modalHoraPropuesta"></div>
        <div class="modal-buttons">
            <button id="btnConfirmarAceptar" class="btn-aceptar">✅ Aceptar</button>
            <button id="btnRechazarTarea" class="btn-danger" style="background:#dc2626; color:white; border:none; padding:12px; border-radius:40px; font-weight:600; cursor:pointer;">❌ Rechazar</button>
            <button id="btnVolverAceptar" class="btn-cancelar">◀ Volver</button>
        </div>
    </div>
</div>

<div id="modalAlbaran" class="modal-overlay">
    <div class="modal-content">
        <h3>💰 ALBARÁN DE SERVICIO</h3>
        <div class="form-group"><label>⏱️ Horas trabajadas</label><input type="number" id="albaranHoras" step="0.5" placeholder="0" value="0"></div>
        <div class="form-group"><label>💰 Precio por hora (€)</label><input type="number" id="albaranPrecioHora" step="0.01" placeholder="0.00" value="0"></div>
        <div class="form-group"><label>🧰 Materiales (€)</label><input type="number" id="albaranMateriales" step="0.01" placeholder="0.00" readonly></div>
        <div class="form-group"><label>🚗 Dietas / desplazamiento (€)</label><input type="number" id="albaranDietas" step="0.01" placeholder="0.00" value="0"></div>
        <div class="form-group"><label><strong>💰 TOTAL (€)</strong></label><input type="text" id="albaranTotal" readonly style="font-weight: bold; font-size: 1.1rem;"></div>
        <div class="modal-buttons">
            <button id="btnAceptarAlbaran" class="btn-aceptar">✅ Guardar albarán</button>
            <button id="btnCancelarAlbaran" class="btn-cancelar">✖ Cancelar</button>
        </div>
    </div>
</div>

<div id="modalDetalleTarea" class="modal-overlay">
    <div class="modal-content">
        <h3>📋 Detalle completo de la tarea</h3>
        <div id="detalleTareaContent" class="detalle-info"></div>
        <div class="modal-buttons"><button id="btnCerrarDetalle" class="btn-cancelar">✖ Cerrar</button></div>
    </div>
</div>

<div id="modalVerOrden" class="modal-overlay">
    <div class="modal-content">
        <h3>📋 ORDEN DE TRABAJO</h3>
        <div id="ordenTrabajoContent" class="detalle-info" style="white-space: pre-wrap;"></div>
        <div class="modal-buttons"><button id="btnCerrarOrden" class="btn-cancelar">✖ Cerrar</button></div>
    </div>
</div>

<script type="module">
    import { init } from './js/main.js'
    init()
</script>
</body>
</html>
