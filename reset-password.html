<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña - COMUTECH</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Helvetica Neue', system-ui, sans-serif;
            background: #f2f2f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 44px;
            padding: 32px 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        h1 { font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 8px; color: #1c1c1e; }
        .subtitle { text-align: center; color: #8e8e93; font-size: 14px; margin-bottom: 32px; }
        .grupo { margin-bottom: 20px; }
        label { font-size: 12px; font-weight: 600; color: #8e8e93; text-transform: uppercase; margin-bottom: 6px; display: block; }
        input { width: 100%; padding: 16px; background: #f2f2f6; border: none; border-radius: 14px; font-size: 16px; }
        input:focus { outline: none; box-shadow: 0 0 0 4px rgba(0,122,255,0.1); background: white; }
        button { width: 100%; padding: 16px; background: #007aff; color: white; border: none; border-radius: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        button:hover { background: #0051d5; }
        button:disabled { background: #8e8e93; cursor: not-allowed; }
        .message { margin-top: 16px; padding: 12px; border-radius: 12px; text-align: center; font-size: 14px; }
        .message.error { background: #fee2e2; color: #c2410c; }
        .message.success { background: #d1fae5; color: #065f46; }
        .message.info { background: #dbeafe; color: #1e40af; }
        .footer { margin-top: 24px; text-align: center; font-size: 13px; }
        .footer a { color: #007aff; text-decoration: none; }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 COMUTECH</h1>
        <div class="subtitle">Restablecer contraseña</div>
        
        <div id="statusMessage" class="message info" style="margin-bottom: 20px;">🔄 Verificando enlace...</div>
        
        <div id="formContent" style="display: none;">
            <div class="grupo">
                <label>Nueva contraseña</label>
                <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres">
            </div>
            <div class="grupo">
                <label>Confirmar contraseña</label>
                <input type="password" id="confirmPassword" placeholder="Repite la contraseña">
            </div>
            <button id="btnReset">Actualizar contraseña</button>
            <div id="message"></div>
        </div>
        
        <div class="footer">
            <a href="/super-user/">← Volver al inicio</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://idbdkxhhqeuarcqcaweo.supabase.co';
        
        const statusDiv = document.getElementById('statusMessage');
        const formDiv = document.getElementById('formContent');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const btnReset = document.getElementById('btnReset');
        const messageDiv = document.getElementById('message');
        
        const hash = window.location.hash;
        const params = new URLSearchParams(hash.substring(1));
        const accessToken = params.get('access_token');
        const type = params.get('type');
        
        let userEmail = null;
        
        // Decodificar token para obtener el email
        function getEmailFromToken() {
            try {
                const parts = accessToken.split('.');
                if (parts.length !== 3) {
                    console.error('Token inválido, partes:', parts.length);
                    return null;
                }
                const payload = JSON.parse(atob(parts[1]));
                console.log('Payload decodificado:', payload);
                userEmail = payload.email;
                return userEmail;
            } catch (e) {
                console.error('Error decodificando token:', e);
                return null;
            }
        }
        
        async function init() {
            console.log('🔧 Iniciando restablecimiento');
            console.log('Hash:', hash);
            console.log('Access token:', accessToken ? 'PRESENTE' : 'NO');
            console.log('Tipo:', type);
            
            if (!accessToken || type !== 'recovery') {
                statusDiv.innerHTML = '<div class="message error">❌ Enlace inválido o expirado</div>';
                return;
            }
            
            const email = getEmailFromToken();
            console.log('Email obtenido:', email);
            
            if (email) {
                statusDiv.innerHTML = '<div class="message success">✅ Enlace válido. Introduce tu nueva contraseña.</div>';
                formDiv.style.display = 'block';
            } else {
                statusDiv.innerHTML = '<div class="message error">❌ No se pudo obtener el email del enlace</div>';
            }
        }
        
        async function updatePassword() {
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            if (!newPassword || newPassword.length < 6) {
                messageDiv.innerHTML = '<div class="message error">❌ Mínimo 6 caracteres</div>';
                return;
            }
            if (newPassword !== confirmPassword) {
                messageDiv.innerHTML = '<div class="message error">❌ Las contraseñas no coinciden</div>';
                return;
            }
            
            btnReset.disabled = true;
            btnReset.innerHTML = '<span class="spinner"></span> Actualizando...';
            messageDiv.innerHTML = '<div class="message info">🔄 Actualizando contraseña...</div>';
            
            try {
                console.log('Enviando petición con email:', userEmail);
                
                const response = await fetch('https://idbdkxhhqeuarcqcaweo.supabase.co/functions/v1/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: userEmail,
                        newPassword: newPassword
                    })
                });
                
                const result = await response.json();
                console.log('Respuesta:', result);
                
                if (!response.ok) throw new Error(result.error);
                
                messageDiv.innerHTML = '<div class="message success">✅ Contraseña actualizada. Redirigiendo...</div>';
                
                setTimeout(() => {
                    window.location.href = '/super-user/';
                }, 2000);
                
            } catch (error) {
                console.error('Error:', error);
                messageDiv.innerHTML = `<div class="message error">❌ ${error.message}</div>`;
                btnReset.disabled = false;
                btnReset.innerHTML = 'Actualizar contraseña';
            }
        }
        
        btnReset.onclick = updatePassword;
        
        newPasswordInput.onkeypress = (e) => { if (e.key === 'Enter') updatePassword(); };
        confirmPasswordInput.onkeypress = (e) => { if (e.key === 'Enter') updatePassword(); };
        
        init();
    </script>
</body>
</html>
