<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Panel Cliente · COMUTECH</title>
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- iOS Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="COMUTECH Cliente">
    
    <!-- LIBRERÍAS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- LOGIN PANEL (acceso con código) -->
<div id="loginPanel" class="login-container">
    <div class="login-card">
        <div class="logo">🔑 COMUTECH</div>
        <h2>Acceso Cliente</h2>
        <p>Introduce tu código de acceso</p>
        <input type="text" id="codigoAcceso" placeholder="Ej: ABC 1234" autocomplete="off" style="text-transform: uppercase;">
        <button id="btnLogin">Acceder</button>
        <div id="errorMsg" class="error-msg"></div>
    </div>
</div>

<!-- DASHBOARD PANEL -->
<div id="dashboardPanel" style="display: none;">
    <div class="dashboard-header">
        <h1 id="nombreEmpresaBanner">Cargando...</h1>
        <div class="header-cliente">
            <span>📋 Código: <span id="codigoEmpresa"></span></span>
            <button id="btnLogout" class="btn-logout">🚪 Salir</button>
        </div>
    </div>
    
    <div id="contenidoPanel"></div>
    
    <!-- TAB BAR (pestañas del cliente) -->
    <div class="bottom-nav">
        <button class="nav-item active" data-tab="tablon">
            <span>📋</span><span>Tablón</span>
        </button>
        <button class="nav-item" data-tab="informacion">
            <span>ℹ️</span><span>Información</span>
        </button>
        <button class="nav-item" data-tab="incidencias">
            <span>⚠️</span><span>Incidencias</span>
        </button>
        <button class="nav-item" data-tab="historico">
            <span>📜</span><span>Histórico</span>
        </button>
    </div>
</div>

<!-- ============================================================ -->
<!-- MODALES                                                      -->
<!-- ============================================================ -->

<!-- Modal Crear Incidencia -->
<div id="modalIncidencia" class="modal-overlay">
    <div class="modal-content" style="max-width: 500px;">
        <h3>⚠️ Reportar incidencia</h3>
        <div class="form-group">
            <label>📝 Título *</label>
            <input type="text" id="incidenciaTitulo" placeholder="Ej: Bomba de la piscina no funciona">
        </div>
        <div class="form-group">
            <label>🏗️ Activo</label>
            <select id="incidenciaActivo">
                <option value="">-- Seleccionar activo --</option>
            </select>
        </div>
        <div class="form-group">
            <label>📄 Descripción *</label>
            <textarea id="incidenciaDescripcion" rows="4" placeholder="Describe el problema detalladamente..."></textarea>
        </div>
        <div class="modal-buttons">
            <button id="btnGuardarIncidencia" class="btn-aceptar">✅ Reportar</button>
            <button id="btnCancelarIncidencia" class="btn-cancelar">✖ Cancelar</button>
        </div>
    </div>
</div>

<!-- Modal Confirmación -->
<div id="modalConfirmacion" class="modal-overlay">
    <div class="modal-content">
        <h3>⚠️ Confirmar acción</h3>
        <p id="mensajeConfirmacion"></p>
        <div class="modal-buttons">
            <button id="btnConfirmarAccion" class="btn-aceptar">✅ Confirmar</button>
            <button id="btnCancelarAccion" class="btn-cancelar">❌ Cancelar</button>
        </div>
    </div>
</div>

<!-- Modal Informativo -->
<div id="modalInformativo" class="modal-overlay">
    <div class="modal-content">
        <h3 id="modalInformativoTitulo">Información</h3>
        <p id="modalInformativoMensaje"></p>
        <div class="modal-buttons">
            <button id="btnCerrarInformativo" class="btn-aceptar">Aceptar</button>
        </div>
    </div>
</div>

<!-- Modal Carga -->
<div id="modalCarga" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 300px; text-align: center;">
        <div class="spinner" style="margin: 0 auto 16px auto;"></div>
        <p id="modalCargaMensaje">Cargando...</p>
    </div>
</div>

<script type="module">
    import { init } from './js/main.js'
    init()
</script>

</body>
</html>
