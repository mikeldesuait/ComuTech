<!-- gerente/templates/clientes/mensajes.html -->
<!-- Comunicación con clientes (simplificado) -->

<div class="container">
    <div class="card">
        <div class="card-header">
            💬 Mensajes con Clientes
            <button id="btnVolverClientes" class="btn-warning" style="float: right; padding: 8px 16px;">◀ Volver</button>
        </div>
        
        <div class="row-flex">
            <div class="grupo">
                <label>🏢 Cliente</label>
                <select id="mensajeCliente" class="full-width">
                    <option value="">-- Seleccionar cliente --</option>
                </select>
            </div>
        </div>
        
        <div id="conversacionContainer" style="margin-top: 20px; max-height: 400px; overflow-y: auto; border: 1px solid var(--ios-border); border-radius: 12px; padding: 16px;">
            <div class="text-center" style="padding: 40px; color: var(--ios-gray);">
                Selecciona un cliente para ver la conversación
            </div>
        </div>
        
        <div class="form-group" style="margin-top: 16px;">
            <label>📝 Escribir mensaje</label>
            <textarea id="nuevoMensaje" rows="2" class="full-width" placeholder="Escribe tu mensaje aquí..."></textarea>
        </div>
        
        <div class="btn-group" style="display: flex; gap: 12px; margin-top: 12px;">
            <button id="btnEnviarMensaje" class="btn-success">📤 Enviar</button>
        </div>
    </div>
</div>

<style>
    .full-width {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--ios-border);
    }
    
    .mensaje-enviado {
        background: #2c7a4d;
        color: white;
        padding: 10px;
        border-radius: 12px;
        margin: 8px 0;
        text-align: right;
    }
    
    .mensaje-recibido {
        background: #e2e8f0;
        color: #1e4663;
        padding: 10px;
        border-radius: 12px;
        margin: 8px 0;
        text-align: left;
    }
    
    .fecha-mensaje {
        font-size: 10px;
        opacity: 0.7;
        margin-top: 4px;
    }
</style>
