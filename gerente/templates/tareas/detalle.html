<!-- gerente/templates/tareas/detalle.html -->
<!-- Detalle completo de una tarea -->

<div class="card">
    <div class="card-header">
        📋 Detalle de Tarea
        <div style="float: right;">
            <button id="btnEditarTarea" class="btn-info" style="margin-right: 8px;">✏️ Editar</button>
            <button id="btnAsignarTarea" class="btn-warning" style="margin-right: 8px;">🔄 Asignar</button>
            <button id="btnHistorialTarea" class="btn-info" style="margin-right: 8px;">📜 Historial</button>
            <button id="btnCerrarDetalle" class="btn-danger">✖ Cerrar</button>
        </div>
    </div>
    
    <div id="detalleContenido">
        <div class="text-center" style="padding: 40px;">
            <div class="spinner"></div>
            <p>Cargando detalle de la tarea...</p>
        </div>
    </div>
</div>
