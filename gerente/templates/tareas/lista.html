<!-- gerente/templates/tareas/lista.html -->
<!-- Lista de tareas -->

<div class="container">
    <div class="card">
        <div class="card-header">
            📋 Lista de Tareas
            <button id="btnNuevaTarea" class="btn-success" style="float: right; padding: 8px 16px;">➕ Nueva</button>
        </div>
        
        <!-- Filtros -->
        <div class="filtros-bar" style="margin-bottom: 20px;">
            <select id="filtroEstado" class="btn-sm">
                <option value="">Todos los estados</option>
                <option value="pendiente">⏳ Pendiente</option>
                <option value="en_progreso">⚙️ En progreso</option>
                <option value="completada">✅ Completada</option>
                <option value="cancelada">❌ Cancelada</option>
            </select>
            <select id="filtroPrioridad" class="btn-sm">
                <option value="">Todas las prioridades</option>
                <option value="baja">🟢 Baja</option>
                <option value="media">🟡 Media</option>
                <option value="alta">🔴 Alta</option>
                <option value="urgente">🔥 Urgente</option>
            </select>
            <input type="text" id="filtroBuscar" placeholder="🔍 Buscar..." class="btn-sm">
            <button id="btnFiltrar" class="btn-info btn-sm">Filtrar</button>
            <button id="btnLimpiarFiltros" class="btn-warning btn-sm">Limpiar</button>
        </div>
        
        <!-- Tabla de tareas -->
        <div id="tareasTableContainer">
            <div class="text-center" style="padding: 40px;">
                <div class="spinner"></div>
                <p>Cargando tareas...</p>
            </div>
        </div>
    </div>
</div>
